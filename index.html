.endcard{position:relative;z-index:2;text-align:center;background:linear-gradient(160deg,#241a52,#150f33);border:2px solid color-mix(in srgb,var(--ec) 55%,transparent);border-radius:30px;padding:30px 36px 26px;width:min(520px,94vw);box-shadow:0 0 0 6px color-mix(in srgb,var(--ec) 16%,transparent),0 30px 80px #000c,0 0 70px color-mix(in srgb,var(--ec) 35%,transparent);animation:endpop .7s cubic-bezier(.2,1.5,.4,1) both}

<script>
// Kern: Hilfsfunktionen, Zustand, Spiele-Register. Wird von allen Spielen genutzt.

const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const app=document.getElementById('app'),R=n=>Math.floor(Math.random()*n),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const dot=i=>`<i class="dot" style="background:var(--p${i})"></i>`;
const setVH=()=>document.documentElement.style.setProperty('--dvh',window.innerHeight+'px');setVH();addEventListener('resize',setVH);addEventListener('orientationchange',()=>setTimeout(setVH,200));
let tm=[],raf=0,names=['Spieler 1','Spieler 2'],CURG=null;
// Scharfe Darstellung: Canvas wird mit der echten Bildschirmauflösung (bis 3x) gezeichnet, die Spiele rechnen weiter in ihren festen Koordinaten.
(function(){const g=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,a){const c=g.call(this,t,a);if(t==='2d'&&c&&!this._hd){this._hd=1;const k=Math.min(2,Math.max(1,window.devicePixelRatio||1)),w=this.width,h=this.height;this.width=Math.round(w*k);this.height=Math.round(h*k);this.style.setProperty('--ar',w/h);this.style.setProperty('--cw',w+'px');this.style.aspectRatio=w+' / '+h;c.setTransform(k,0,0,k,0,0)}return c}})();
const later=(f,ms)=>tm.push(setTimeout(f,ms)),clear=()=>{tm.forEach(clearTimeout);tm=[];cancelAnimationFrame(raf);onresize=onkeydown=onkeyup=null;app.innerHTML='';document.querySelectorAll('.endov,.endpill').forEach(e=>e.remove())};
let RST=null;
function bar(r,fl){RST=r||null;const d=$('div','bar'),b=$('button','sm','← Menü'),s=$('div','st');b.onclick=menu;d.append(b,s);if(r){const n=$('button','sm','↻');n.title='Neu starten';n.onclick=()=>{clear();r()};d.append(n)}if(fl){const f=$('button','sm','⟲ Drehen');f.title='Spielfeld um 180° drehen';f.onclick=()=>{if(typeof fl=='function')fl();else{const e=app.querySelector(fl);if(e)e.classList.toggle('rot180')}};d.append(f)}const q=$('button','sm','?');q.title='Anleitung';q.setAttribute('aria-label','Anleitung');q.onclick=()=>helpModal(CURG);d.append(q);app.append(d);return s}

// ---- Spiele-Register: jedes Spiel meldet sich in games/<ordner>/game.js hier an
const GAMES=[],META={},RULES={};
function registerGame(g){GAMES.push(g);META[g.n]=[g.cat,g.c[0],g.c[1],g.fl,g.pl];RULES[g.n]=g.rules||'';}

// ---- Ergebnis-Bildschirm: großer, animierter Gewinn-/Verlust-Dialog in der Mitte, mit „Nochmal“ und „Zurück ins Menü“
// opt: kind 'win' | 'lose' | 'draw' · title · sub · emoji · stats [[Name,Wert]] · best (Bestwert? → Konfetti) · again (Funktion) · againLabel · delay (ms) · review (Spielfeld ansehen erlauben) · color
function endScreen(opt){
  const go=()=>{
    document.querySelectorAll('.endov,.endpill').forEach(e=>e.remove());onkeydown=onkeyup=null;
    const k=opt.kind||'win',ov=$('div','endov '+k),card=$('div','endcard');
    if(opt.color)ov.style.setProperty('--ec',opt.color);
    const em=opt.emoji||{win:'🏆',lose:'💥',draw:'🤝'}[k];
    card.append($('div','endem',em),$('h2','endt',opt.title||''));
    if(opt.best){card.append($('div','endbest','⭐ Neuer Bestwert!'))}
    if(opt.sub)card.append($('p','ends',opt.sub));
    if(opt.stats&&opt.stats.length){const st=$('div','endst');opt.stats.forEach(([l,v])=>{const c=$('div','endsc'),n=$('b',0,''),num=typeof v=='number';c.append(n,$('small',0,l));st.append(c);
      if(num){const t0=performance.now(),dur=Math.min(900,300+Math.abs(v)*2);const tick=now=>{const q=Math.min(1,(now-t0)/dur);n.textContent=Math.round(v*(1-Math.pow(1-q,3)));if(q<1&&n.isConnected)requestAnimationFrame(tick)};requestAnimationFrame(tick)}else n.textContent=v});card.append(st)}
    const row=$('div','endbtn'),a=$('button','start endagain',opt.againLabel||'↻ Nochmal'),m=$('button','sm endmenu','← Zurück ins Menü');
    a.onclick=()=>{ov.remove();document.querySelectorAll('.endpill').forEach(e=>e.remove());if(opt.again)opt.again();else{clear();if(RST)RST();else menu()}};
    m.onclick=()=>menu('home');
    row.append(a,m);card.append(row);
    if(opt.review){const r=$('button','endrev','Spielfeld ansehen');r.onclick=()=>{ov.remove();const p=$('button','endpill','🏁 Ergebnis anzeigen');p.onclick=()=>{p.remove();document.body.append(ov)};document.body.append(p)};card.append(r)}
    ov.append(card);
    if(k=='win'||opt.best){const cf=$('div','confetti'),cs=['#ffd166','#ef476f','#06d6a0','#118ab2','#b44fd8','#f97316','#fff'];for(let i=0;i<70;i++){const e=$('i');e.style.cssText=`left:${R(100)}%;background:${cs[R(cs.length)]};animation-delay:${(Math.random()*.9).toFixed(2)}s;animation-duration:${(2.2+Math.random()*2).toFixed(2)}s;--dx:${R(160)-80}px;--rt:${R(900)-450}deg;width:${6+R(7)}px;height:${10+R(10)}px`;cf.append(e)}ov.append(cf)}
    document.body.append(ov);try{a.focus({preventScroll:true})}catch(e){}
  };
  if(opt.delay)later(go,opt.delay);else go()
}
// Zwei-Spieler-/Computer-Ergebnis: w = 0 oder 1 (Sieger), -1 = Unentschieden. names[1]=='Computer' → Spiel gegen den Computer.
function duelEnd(w,o={}){
  const vsC=names[1]=='Computer',base=w<0?{kind:'draw',title:'Unentschieden',emoji:'🤝'}:vsC?(w==0?{kind:'win',title:'Du hast gewonnen!',emoji:'🏆'}:{kind:'lose',title:'Computer gewinnt',emoji:'🤖'}):{kind:'win',title:names[w]+' gewinnt!',emoji:'🏆',color:`var(--p${w})`};
  endScreen({...base,...o})
}
// Punkte-Spiel zu Ende: Bestwert → Konfetti
function scoreEnd(o){endScreen({kind:o.best?'win':'lose',emoji:o.best?'🏆':(o.emoji||'💥'),...o})}

// ---- Partikel-Effekte für Canvas-Spiele
function FX(){const a=[];return{
  burst(x,y,c,n=10,sp=4,life=34,size=4){for(let i=0;i<n;i++){const an=Math.random()*6.283,v=(.4+Math.random())*sp;a.push({x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-sp*.3,l:life*(.6+Math.random()*.6),L:life,c,s:size*(.6+Math.random()*.8),g:.18})}},
  text(x,y,t,c='#fff',size=22,life=55){a.push({x,y,vx:0,vy:-1.1,l:life,L:life,c,s:size,t,g:0})},
  ring(x,y,c,r=30,life=22){a.push({x,y,vx:0,vy:0,l:life,L:life,c,s:r,ring:1,g:0})},
  step(d){for(const p of a){p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=p.g*d;p.vx*=.99;p.l-=d}for(let i=a.length-1;i>=0;i--)if(a[i].l<=0)a.splice(i,1)},
  draw(x){x.save();x.textAlign='center';for(const p of a){const q=Math.max(0,p.l/p.L);x.globalAlpha=Math.min(1,q*1.6);
    if(p.t){x.fillStyle=p.c;x.font=`900 ${p.s}px ui-rounded,system-ui,sans-serif`;x.lineWidth=5;x.strokeStyle='#14213d';x.lineJoin='round';x.strokeText(p.t,p.x,p.y);x.fillText(p.t,p.x,p.y)}
    else if(p.ring){x.strokeStyle=p.c;x.lineWidth=4*q+1;x.beginPath();x.arc(p.x,p.y,p.s*(1.6-q),0,7);x.stroke()}
    else{x.fillStyle=p.c;x.fillRect(p.x-p.s*q/2,p.y-p.s*q/2,p.s*q,p.s*q)}}x.restore()},
  get n(){return a.length}}}

<script>
// Anleitungen aller Spiele. Schlüssel = Spielname.
// z Ziel · s Ablauf (nummeriert) · k Steuerung · p Regeln und Punkte · o Einstellungen erklärt · t Tipps
const HELP={
'Schach':{z:'Setze den gegnerischen König matt: Er steht im Schach (wird angegriffen) und kann nicht mehr entkommen. Weiß beginnt, Spieler 1 spielt Weiß.',
s:['Tippe eine eigene Figur an. Gelbe Punkte zeigen, wohin sie ziehen darf, ein gelber Ring zeigt ein Feld mit einer gegnerischen Figur, die du schlagen kannst.','Tippe das Zielfeld an. Die Figur gleitet dorthin. Danach ist der Gegner dran.','Der Zug des Gegners ist gelb hinterlegt, damit du ihn nicht verpasst. Ein König im Schach leuchtet rot.','Das Spiel endet mit Schachmatt, Patt (kein erlaubter Zug, aber kein Schach) oder Remis bei zu wenig Material.'],
k:'Antippen: erst die Figur, dann das Zielfeld. Mit „⟲ Drehen“ oben drehst du das Brett um 180°, z. B. wenn der zweite Spieler gegenüber sitzt. „↶ Zug zurück“ nimmt deinen letzten Zug zurück (gegen den Computer auch dessen Antwort).',
p:['Bauer: zieht ein Feld vorwärts, aus der Grundstellung auch zwei. Er schlägt nur schräg vorwärts. Erreicht er die letzte Reihe, darfst du wählen: Dame, Turm, Läufer oder Springer.','Turm: gerade, beliebig weit. Läufer: diagonal. Dame: gerade und diagonal. König: ein Feld in jede Richtung. Springer: in L-Form (zwei Felder gerade, eines seitlich) und springt über Figuren.','Rochade: König und Turm tauschen in einem Zug. Der König geht zwei Felder zum Turm, der Turm springt auf die andere Seite. Erlaubt nur, wenn beide noch nie gezogen haben, zwischen ihnen alles frei ist und der König weder im Schach steht noch über ein bedrohtes Feld zieht. Tippe dafür den König an und dann das Feld zwei Schritte daneben.','En passant: Zieht ein gegnerischer Bauer zwei Felder und landet neben deinem Bauern, darfst du ihn im direkten nächsten Zug schlagen, als wäre er nur ein Feld gegangen.','Du darfst nie einen Zug machen, nach dem dein eigener König im Schach steht. Solche Züge werden nicht angeboten.','Unter dem Brett siehst du, welche Figuren schon geschlagen wurden.'],
o:['Gegner: Computer oder zu zweit am selben Gerät.','Computer-Stärke: Leicht macht oft Fehler, Mittel schaut einen Zug voraus, Schwer plant mehrere Züge im Voraus (braucht kurz zum Überlegen).','Ansicht zu zweit: „Fest“ hält Weiß immer unten. „Gegenüber“ dreht nur die schwarzen Figuren, damit der Gegner sie richtig herum sieht. „Brett dreht sich“ dreht nach jedem Zug das ganze Brett zum Spieler, der dran ist.'],
t:['Bringe früh Springer und Läufer ins Spiel und rochiere, bevor der Gegner angreift.','Die vier Felder in der Mitte sind am wichtigsten.','Prüfe vor jedem Zug: Kann der Gegner danach eine meiner Figuren schlagen?','Schwache Figuren wie Bauern erst opfern, wenn es etwas bringt: Dame 9, Turm 5, Läufer und Springer je 3, Bauer 1.']},
'Vier in einer Reihe':{z:'Bringe als Erster vier eigene Steine in eine Reihe: waagerecht, senkrecht oder diagonal.',
s:['Das Feld hat 7 Spalten und 6 Reihen. Ihr setzt abwechselnd, Spieler 1 beginnt.','Klassisch: Tippe auf eine Spalte, der Stein fällt bis ganz nach unten oder auf den obersten Stein.','Freies Feld: Tippe direkt auf das Feld, auf dem der Stein liegen soll. Er bleibt dort, auch in der Luft.','Sobald eine Viererreihe entsteht, ist das Spiel gewonnen. Ist alles voll, gibt es ein Unentschieden.'],
k:'Klassisch: auf die Spalte tippen. Freies Feld: auf das Feld tippen.',
p:['Im freien Modus gibt es viel mehr Möglichkeiten für Drohungen, der Computer rechnet dort aber weniger Züge voraus.'],
o:['Gegner: Computer oder zu zweit.','Modus: Klassisch (Steine fallen) oder Freies Feld (überall setzen).','Computer-Stärke: Leicht setzt oft zufällig, blockt und gewinnt aber manchmal. Mittel denkt ein paar Züge voraus. Schwer plant im klassischen Modus sechs Züge im Voraus.'],
t:['Die mittlere Spalte bringt die meisten Möglichkeiten.','Baue eine Drohung, bei der du an zwei Stellen gleichzeitig vollenden könntest. Der Gegner kann nur eine blocken.','Schau vor jedem Zug, ob der Gegner mit seinem nächsten Stein gewinnen würde, und blocke ihn.']},
'Reversi':{z:'Habe am Ende die meisten Steine deiner Farbe auf dem Brett.',
s:['Das Spiel startet mit vier Steinen in der Mitte. Spieler 1 beginnt.','Du musst so setzen, dass du mindestens einen gegnerischen Stein einkesselst: In einer geraden oder diagonalen Linie liegen nur gegnerische Steine zwischen deinem neuen und einem deiner alten Steine.','Alle eingekesselten Steine drehen sich um und gehören dir. Mögliche Felder zeigen einen kleinen Punkt.','Kannst du nicht ziehen, wird automatisch ausgesetzt, das steht oben im Status. Sind beide blockiert oder das Brett voll, ist das Spiel zu Ende.'],
k:'Antippen eines Feldes mit Punkt. „⟲ Drehen“ dreht das Brett um 180°.',
p:['Gewonnen hat, wer am Ende mehr Steine hat. Der Zwischenstand steht oben (z. B. 12:9).'],
o:['Gegner: Computer oder zu zweit.','Computer-Stärke: Leicht zieht zufällig. Mittel nimmt gerne Ecken und viele Steine. Schwer rechnet mehrere Züge voraus und achtet auf Ecken und Beweglichkeit.'],
t:['Ecken kann dir niemand mehr wegnehmen, das sind die besten Felder.','Die Felder direkt neben den Ecken sind gefährlich, weil sie dem Gegner die Ecke schenken können.','Mehr Steine zu haben ist früh im Spiel nicht gut: Wer wenige Steine hat, hat oft mehr Zugmöglichkeiten.']},
'Mühle':{z:'Bilde Mühlen (drei eigene Steine in einer Linie) und nimm so dem Gegner Steine weg, bis er nur noch zwei hat oder nicht mehr ziehen kann.',
s:['Phase 1, Setzen: Ihr setzt abwechselnd je 9 Steine auf freie Punkte. Oben steht, wie viele du noch hast.','Phase 2, Ziehen: Wenn alle Steine gesetzt sind, ziehst du pro Zug einen Stein auf einen freien, benachbarten Punkt entlang der Linien. Tippe erst den Stein, dann das Ziel.','Phase 3, Springen: Hast du nur noch 3 Steine, darfst du mit einem Stein auf jeden beliebigen freien Punkt springen.','Bildest du eine Mühle, darfst du sofort einen gegnerischen Stein entfernen. Mögliche Steine leuchten gelb, tippe einen an.'],
k:'Antippen der Punkte. „⟲ Drehen“ dreht das Brett um 180°.',
p:['Steine aus einer gegnerischen Mühle darfst du nur nehmen, wenn alle gegnerischen Steine in Mühlen stehen.','Du verlierst, wenn du nur noch 2 Steine hast (inklusive nicht gesetzter) oder nicht ziehen kannst.','Eine Mühle, die du öffnest und wieder schließt („Zwickmühle“), zählt jedes Mal neu.'],
o:['Gegner: Computer oder zu zweit.','Computer-Stärke: Leicht spielt zufällig. Mittel schließt Mühlen und blockt. Schwer baut zusätzlich eigene Doppel-Drohungen auf und nimmt gezielt wichtige Steine weg.'],
t:['Setze nicht nur Mühlen im Blick, sondern auch Beweglichkeit: Steine in der Mitte haben mehr Nachbarpunkte.','Eingesperrte Steine verlieren das Spiel. Lass deine Steine nicht von Gegnern blockieren.']},
'Mancala':{z:'Sammle mehr Steine in deinem Speicher (dem großen Feld) als dein Gegner. Spieler 1 spielt unten, Spieler 2 oben.',
s:['Jede der 12 Mulden startet mit 4 Steinen. Der untere Spieler hat seinen Speicher rechts, der obere links.','Tippe eine nicht leere Mulde auf deiner Seite an. Alle Steine daraus werden verteilt, gegen den Uhrzeigersinn, je einer pro Mulde.','Dein Speicher wird mitgefüllt, der des Gegners wird übersprungen.','Danach ist der Gegner dran, außer dein letzter Stein landete in deinem Speicher.'],
k:'Antippen einer Mulde. Anwählbare Mulden sind farbig umrandet. „⟲ Drehen“ dreht das Brett.',
p:['Extrazug: Endet der letzte Stein im eigenen Speicher, darfst du nochmal ziehen.','Fangen: Endet der letzte Stein in einer vorher leeren Mulde auf deiner Seite und gegenüber liegen Steine, bekommst du diese zusammen mit deinem Stein in den Speicher.','Das Spiel endet, sobald eine Seite komplett leer ist. Die Steine auf der anderen Seite gehören deren Besitzer. Wer mehr im Speicher hat, gewinnt.'],
o:['Gegner: Computer oder zu zweit.','Computer-Stärke: Leicht zieht zufällig. Mittel nutzt Extrazüge. Schwer rechnet mehrere Züge voraus.'],
t:['Zähle nach: Eine Mulde mit genau so vielen Steinen, wie sie vom Speicher entfernt ist, bringt einen Extrazug.','Mulden direkt neben dem Speicher früh zu leeren verschenkt Extrazüge.']},
'Tic-Tac-Toe':{z:'Bringe drei eigene Zeichen in eine Reihe: waagerecht, senkrecht oder diagonal.',
s:['Ihr setzt abwechselnd ✕ und ○ auf ein freies Feld des 3×3-Rasters.','Wer zuerst drei in einer Reihe hat, bekommt einen Punkt. Die Reihe leuchtet gelb.','Mit „Nächste Runde“ geht es weiter, der Anfänger wechselt jede Runde. Der Punktestand steht oben.'],
k:'Antippen eines Feldes. „⟲ Drehen“ dreht das Brett.',
p:['Voll ohne drei in einer Reihe ist ein Unentschieden, es gibt keinen Punkt.'],
o:['Gegner: Computer oder zu zweit.','Computer-Stärke: Leicht macht oft Zufallszüge. Mittel gewinnt und blockt. Schwer ist perfekt und verliert nie: Gegen ihn ist ein Unentschieden das beste Ergebnis.'],
t:['Beginne in der Mitte oder in einer Ecke.','Versuche eine Gabel: ein Zug, der zwei Gewinnmöglichkeiten gleichzeitig schafft.']},
'Ultimate Tic-Tac-Toe':{z:'Gewinne drei kleine Felder in einer Reihe auf dem großen 3×3-Brett.',
s:['Das Brett besteht aus 9 kleinen Tic-Tac-Toe-Feldern. Spieler 1 darf im ersten Zug überall setzen.','Dein Zug bestimmt, wo der Gegner spielen muss: Setzt du in das Kästchen oben rechts eines kleinen Feldes, muss der Gegner im Feld oben rechts des großen Bretts setzen. Das Feld, in dem gesetzt werden muss, hat einen gelben Rahmen.','Wer in einem kleinen Feld drei in einer Reihe bildet, gewinnt dieses Feld. Es zeigt dann ein großes ✕ oder ○.','Ist das vorgegebene Feld schon gewonnen oder voll, darf der Gegner in jedes freie Feld setzen. Wer zuerst drei große Felder in einer Reihe hat, gewinnt.'],
k:'Antippen eines Kästchens im gelb umrandeten Feld. „⟲ Drehen“ dreht das Brett.',
o:['Gegner: Computer oder zu zweit.','Computer-Stärke: Leicht zieht zufällig. Mittel sucht Gewinne und gute Felder. Schwer schickt dich nicht in Felder, in denen du sofort gewinnst.'],
t:['Denke immer an den nächsten Zug: Wohin schickst du den Gegner?','Schicke den Gegner in Felder, die schon entschieden sind, nur wenn es dir nützt: Dann darf er überall hin.']},
'Paare finden':{z:'Finde alle Kartenpaare. Allein mit möglichst wenigen Zügen, zu zweit mit den meisten Paaren.',
s:['Decke nacheinander zwei Karten auf.','Sind beide gleich, bleiben sie offen liegen. Zu zweit darfst du direkt nochmal.','Sind sie verschieden, werden sie kurz gezeigt und dann wieder umgedreht. Zu zweit ist dann der andere dran.','Sind alle Paare gefunden, ist das Spiel zu Ende.'],
k:'Antippen der Karten. Während zwei falsche Karten sichtbar sind, kannst du nicht weitertippen. Das Raster passt sich automatisch dem Bildschirm an.',
p:['Allein zählen Züge (ein Zug = zwei aufgedeckte Karten) und gefundene Paare. Zu zweit zählt jeder Spieler seine Paare, oben steht der Stand.'],
o:['Motive: Tiere, Essen, Fahrzeuge oder Flaggen. Flaggen sind am schwersten, weil viele ähnlich aussehen.','Schwierigkeit: 4×4 (8 Paare), 4×6 (12), 6×6 (18) und 5×8 (20 Paare).','Spieler: Allein oder zu zweit.'],
t:['Merke dir auch die Karten, die der andere aufdeckt.','Decke zuerst Karten auf, die du noch nie gesehen hast. So lernst du am meisten.']},
'Kästchen':{z:'Schließe mehr Kästchen als dein Gegner.',
s:['Ihr zieht abwechselnd eine Linie zwischen zwei benachbarten Punkten.','Wer mit seiner Linie die vierte Seite eines Kästchens schließt, bekommt das Kästchen (es zeigt seine Farbe) und darf nochmal.','Sind alle Kästchen vergeben, gewinnt, wer mehr hat.'],
k:'Antippen einer Linie. „⟲ Drehen“ dreht das Feld.',
p:['Eine Linie, die ein Kästchen zur dritten Seite macht, schenkt dem Gegner dieses Kästchen. Vermeide das, solange du kannst.','Am Ende muss irgendwer ganze Ketten von Kästchen abgeben. Wer diese Ketten klug verteilt, gewinnt.'],
o:['Gegner: Computer oder zu zweit.','Spielfeld: 4×4, 5×5 oder 6×6 Kästchen.','Computer-Stärke: Leicht zieht zufällig. Mittel nimmt Kästchen und vermeidet dritte Seiten. Schwer opfert am Ende möglichst kurze Ketten.'],
t:['Setze zuerst Linien, die keine dritte Seite erzeugen.','Wenn du gezwungen bist, etwas abzugeben, gib die kürzeste Kette.']},
'Würfelkönig':{z:'Sammle in 13 Runden möglichst viele Punkte, wie bei Kniffel.',
s:['Tippe auf „Würfeln“. Du hast pro Runde bis zu 3 Würfe.','Nach dem ersten Wurf kannst du Würfel antippen, die du behalten willst. Sie werden gelb. Alle anderen werden beim nächsten Wurf neu gewürfelt.','Wähle in der Tabelle ein freies Feld. Dort steht, wie viele Punkte du bekommen würdest. Danach ist die Runde vorbei.','Jedes der 13 Felder wird nur einmal benutzt. Passt nichts, wähle ein Feld mit 0 und streiche es so.'],
k:'Antippen: Würfel zum Behalten, Knopf „Würfeln“, ein Feld in der Tabelle.',
p:['Einser bis Sechser: Summe aller Würfel mit dieser Augenzahl. Ab 63 Punkten in diesem Block bekommst du 35 Bonuspunkte.','Dreierpasch: mindestens 3 gleiche, Punkte = Summe aller 5 Würfel. Viererpasch: mindestens 4 gleiche, Summe aller Würfel.','Full House (3 gleiche und 2 gleiche): 25. Kleine Straße (4 aufeinanderfolgende, z. B. 2-3-4-5): 30. Große Straße (5 aufeinanderfolgende): 40. Fünferpasch (5 gleiche): 50. Chance: Summe aller Würfel, immer erlaubt.'],
o:['Allein: ein Ergebnis zum Verbessern. Zu zweit: abwechselnd, beide sehen die Tabelle. Gegen Computer: der Computer würfelt und wählt selbst.'],
t:['Streiche früh ein Feld, das du kaum schaffst (z. B. Fünferpasch), statt später gute Felder zu verbrauchen.','Der Bonus von 35 Punkten ist viel: Ziele in jedem Block auf mindestens drei gleiche.']},
'Blasenschuss':{z:'Lass alle Kugeln platzen und verhindere, dass sie die rote Linie unten erreichen.',
s:['Ziele mit dem Finger oder der Maus. Eine gestrichelte Linie zeigt den Weg, Wände werfen die Kugel zurück.','Lass los, um zu schießen. Die Kugel bleibt an anderen Kugeln hängen.','Drei oder mehr gleichfarbige Kugeln, die sich berühren, platzen. Kugeln, die dadurch nicht mehr mit der Decke verbunden sind, fallen ebenfalls.','Tippe auf die kleine Reservekugel unten links, um die aktuelle zu tauschen.','Alle paar Schüsse und nach einer Zeit kommt oben eine neue Reihe dazu, der Balken ganz oben zeigt die Zeit.'],
k:'Ziehen = zielen, Loslassen = schießen. Tastatur: Pfeile links/rechts zielen, Leertaste schießt, Pfeil runter tauscht.',
p:['Punkte: 10 pro geplatzter Kugel, Bonus bei größeren Gruppen, 20 pro herabgefallener Kugel, 500 für ein geräumtes Level.','Neue Reihe: Leicht nach 7 Schüssen oder 18 Sekunden, Mittel nach 6 Schüssen oder 15 Sekunden, Schwer nach 5 Schüssen oder 12 Sekunden.','Das Spiel ist vorbei, wenn Kugeln die rote gestrichelte Linie berühren.'],
o:['Schwierigkeit: Leicht 4, Mittel 5, Schwer 6 Farben.'],
t:['Triff Kugeln, die ganze Gruppen oben halten: Dann fällt viel auf einmal.','Nutze Banden: Schieße schräg an die Wand, um schwer erreichbare Stellen zu treffen.']},
'Block-Blitz':{z:'Lege Blöcke aufs 8×8-Feld, räume volle Linien ab und sammle möglichst viele Punkte, bis nichts mehr passt.',
s:['Unten liegen drei Blöcke. Ziehe einen mit dem Finger aufs Feld. Er erscheint etwas über dem Finger, damit du ihn sehen kannst.','Lasse los: Passt der Block (die Vorschau ist sichtbar), bleibt er liegen.','Jede komplett gefüllte Reihe oder Spalte verschwindet.','Sind alle drei Blöcke gelegt, kommen drei neue.','Ist kein Block mehr platzierbar, ist das Spiel vorbei.'],
k:'Block ziehen und loslassen. Zum Abbrechen außerhalb des Feldes loslassen. Blöcke lassen sich nicht drehen.',
p:['Jeder gelegte Block gibt so viele Punkte wie er Kästchen hat.','Räumst du n Linien auf einmal ab, gibt es n × n × 10 Punkte. Zwei Linien gleichzeitig sind also 40, drei 90.'],
o:['Schwierigkeit: Leicht nur kleine Blöcke, Mittel alle Formen, Schwer bevorzugt große Blöcke.'],
t:['Schau erst alle drei Blöcke an und plane die Reihenfolge.','Lass Platz für lange Blöcke. Halte das Feld möglichst zusammenhängend.']},
'Kaktoku':{z:'Setze in jede Reihe, jede Spalte und jede Farbfläche genau einen Kaktus.',
s:['Tippe ein Feld einmal: Es bekommt ein ✖ (hier ist sicher kein Kaktus). Das hilft dir beim Merken.','Tippe nochmal: Ein Kaktus wird gesetzt. Ein dritter Tipp löscht das Feld wieder.','Zwei Kakteen dürfen sich nicht berühren, auch nicht diagonal.','Kakteen, die gegen eine Regel verstoßen, leuchten rot. Sind alle Kakteen richtig, ist das Rätsel gelöst und die Zeit wird gespeichert.'],
k:'Antippen der Felder.',
p:['Pro Reihe, Spalte und Farbe genau ein Kaktus, insgesamt so viele wie die Seitenlänge.','Jedes Rätsel hat genau eine Lösung, du musst nie raten.'],
o:['Größe: 6×6 bis 9×9. Größere Felder haben mehr Farbflächen und brauchen mehr Zeit.'],
t:['Beginne bei den kleinsten Farbflächen: Dort ist wenig Platz.','Eine Farbfläche, die nur in einer Reihe liegt, sperrt die ganze Reihe für andere Farben.','Markiere alle unmöglichen Felder mit ✖, dann siehst du die Lösung oft von selbst.']},
'Shikaku':{z:'Teile das ganze Feld in Rechtecke. Jedes Rechteck enthält genau eine Zahl, und diese Zahl ist die Fläche des Rechtecks.',
s:['Ziehe mit dem Finger von einer Ecke zur gegenüberliegenden: Ein Rechteck erscheint.','Es wird grün, wenn es genau eine Zahl enthält und seine Fläche stimmt. Sonst ist es blau.','Zum Löschen tippe ein Rechteck einfach an. Neue Rechtecke überdecken alte automatisch.','Das Rätsel ist gelöst, wenn alle Felder in grünen Rechtecken liegen.'],
k:'Ziehen = Rechteck zeichnen. Antippen = Rechteck löschen.',
p:['Eine „6“ kann 1×6, 2×3, 3×2 oder 6×1 groß sein. Rechtecke dürfen sich nicht überlappen und es darf kein Feld frei bleiben.'],
o:['Größe: 5×5, 7×7 oder 9×9. Jedes Rätsel wird neu erzeugt.'],
t:['Große Zahlen in den Ecken haben oft nur eine sinnvolle Form.','Eine „1“ ist immer ein einzelnes Feld.']},
'Zahlenfusion':{z:'Verschmilz gleiche Zahlen und baue möglichst große Kacheln.',
s:['Wische in eine Richtung: Alle Kacheln rutschen so weit wie möglich dorthin.','Berühren sich zwei Kacheln mit gleicher Zahl, verschmelzen sie zur doppelten Zahl. Diese Zahl wird zu deinen Punkten addiert.','Nach jedem gültigen Zug erscheint eine neue Kachel (2, selten 4).','Wenn das Feld voll ist und nichts mehr verschmelzen kann, ist das Spiel vorbei. Das Ziel ist die Kachel 2048.'],
k:'Wischen oder Pfeiltasten (auch W, A, S, D).',
p:['Jede Verschmelzung gibt die Zahl der neuen Kachel als Punkte. Nach 2048 kannst du weiterspielen.'],
o:['Spielfeld: Klassisch 4×4, Leicht 5×5 (mehr Platz) oder Schwer 3×3.'],
t:['Halte die größte Kachel in einer Ecke und wische vor allem in zwei Richtungen.','Wische nur in die vierte Richtung, wenn es gar nicht anders geht.']},
'Blockfall':{z:'Lass fallende Steine volle Reihen bilden. Volle Reihen verschwinden. Du verlierst, wenn die Steine oben anstoßen.',
s:['Tippe aufs Feld, um zu starten.','Ziehe den Finger nach links oder rechts, um den Stein zu bewegen. Tippe kurz, um ihn zu drehen.','Wische nach unten, um den Stein sofort fallen zu lassen. Die graue Vorschau zeigt, wo er landen würde.','Alle 10 Linien steigt das Level, die Steine fallen schneller.'],
k:'Touch: Ziehen = bewegen, Tippen = drehen, Wischen nach unten = fallen lassen. Tastatur: Pfeile oder W/A/S/D, Pfeil runter = schneller, Leertaste = fallen lassen.',
p:['Linien auf einmal: 1 = 100, 2 = 300, 3 = 500, 4 = 800 Punkte, jeweils mal Level.','Dazu gibt es Punkte für schnelles Absenken der Steine.'],
o:['Starten bei: Level 1, 4 oder 8. Höhere Level beginnen schon schnell.'],
t:['Halte die Oberfläche möglichst flach.','Hebe Lücken auf, bevor du hohe Türme baust.']},
'Minenfeld':{z:'Decke alle Felder ohne Mine auf, ohne eine Mine zu treffen.',
s:['Tippe ein Feld an, um es aufzudecken. Der erste Tipp ist immer sicher und deckt meistens eine größere Fläche auf.','Eine Zahl zeigt, wie viele der bis zu 8 Nachbarfelder Minen enthalten. Leere Felder decken ihre Nachbarn automatisch mit auf.','Markiere vermutete Minen mit einer Flagge.','Triffst du eine Mine, ist das Spiel vorbei. Sind alle sicheren Felder offen, hast du gewonnen. Die Zeit wird gespeichert.'],
k:'Antippen = aufdecken. Langes Drücken, Rechtsklick oder der Schalter „⛏ Aufdecken / 🚩 Flagge“ oben = Flagge setzen oder entfernen. Tippst du eine aufgedeckte Zahl an, die genau so viele Flaggen um sich hat, werden die restlichen Nachbarn auf einmal aufgedeckt (Schnellaufdecken).',
p:['Oben steht die Zahl der noch nicht markierten Minen und die Zeit.'],
o:['Größe: Leicht 9×9 mit 10 Minen, Mittel 12×12 mit 25, Schwer 16×16 mit 40.'],
t:['Eine „1“ mit nur einem verdeckten Nachbarn verrät dort die Mine.','Setze Flaggen, damit du das Schnellaufdecken nutzen kannst.']},
'Schiebepuzzle':{z:'Bringe die Zahlen in die richtige Reihenfolge von 1 aufwärts. Die Lücke ist am Ende unten rechts.',
s:['Tippe eine Kachel in derselben Reihe oder Spalte wie die Lücke an.','Alle Kacheln zwischen ihr und der Lücke rutschen mit.','Sortiere, bis alles stimmt. Der Zug- und Zeitzähler läuft ab dem ersten Zug.'],
k:'Antippen der Kacheln.',
o:['Größe: 3×3, 4×4 oder 5×5. Das Puzzle wird aus lauter erlaubten Zügen gemischt und ist immer lösbar.'],
t:['Löse zuerst die oberste Reihe, dann die zweite und so weiter.','Die letzten zwei Reihen löst du am besten Spalte für Spalte.']},
'Farbflut':{z:'Färbe das ganze Feld mit nur einer Farbe ein, bevor die Züge aufgebraucht sind.',
s:['Dein Gebiet startet in der oberen linken Ecke.','Tippe unten eine Farbe an: Dein ganzes Gebiet wird in dieser Farbe gefärbt und verschluckt alle angrenzenden Felder in derselben Farbe.','Wiederhole das, bis das ganze Feld einfarbig ist.'],
k:'Antippen der Farbkreise unter dem Feld.',
p:['Die Zahl der erlaubten Züge steht oben und hängt von Größe und Farbanzahl ab.'],
o:['Größe: 10×10, 14×14 oder 18×18.','Farben: 4 (leicht), 6 oder 8 (schwer). Mehr Farben brauchen mehr Züge.'],
t:['Wähle die Farbe, die am meisten neue Felder angrenzt.','Auch Farben, die dich nur an eine neue Ecke bringen, können sich lohnen.']},
'Lichter aus':{z:'Schalte alle Lichter aus, mit möglichst wenigen Zügen.',
s:['Tippe ein Feld an: Es und seine vier direkten Nachbarn (oben, unten, links, rechts) wechseln zwischen an und aus.','Plane die Züge so, dass am Ende alles dunkel ist.'],
k:'Antippen der Felder.',
p:['Dein bestes Ergebnis (wenigste Züge) wird pro Größe gespeichert.'],
o:['Größe: 4×4, 5×5 oder 6×6. Das Rätsel wird aus echten Zügen gemischt und ist immer lösbar.'],
t:['Arbeite Reihe für Reihe von oben nach unten: Schalte in jeder Reihe das Licht aus, indem du das Feld darunter drückst.']},
'Farbfolge':{z:'Merke dir die Reihenfolge der leuchtenden Felder und tippe sie nach.',
s:['Schau zu: Felder leuchten nacheinander auf.','Tippe danach dieselbe Reihenfolge nach.','Stimmt alles, kommt in der nächsten Runde ein Feld dazu. Ein Fehler beendet das Spiel.'],
k:'Antippen der Felder.',
p:['Dein Ergebnis ist die Zahl der geschafften Runden. Der Bestwert wird für jede Kombination aus Feldern und Tempo gespeichert.'],
o:['Felder: 4, 6 oder 9.','Tempo: Langsam, Normal oder Schnell.'],
t:['Sprich die Farben leise vor dich hin oder denke dir eine Melodie aus.','Teile lange Folgen in Gruppen von drei.']},
'Flaggen-Quiz':{z:'Erkenne so viele Flaggen wie möglich.',
s:['Wähle Schwierigkeit, Frageart und Zahl der Fragen.','Du siehst eine Flagge und tippst das richtige Land an. Bei „Land → Flagge“ ist es umgekehrt.','Grün bedeutet richtig, rot falsch. Die richtige Antwort wird gezeigt, dann geht es weiter.','Zu zweit wechselt ihr euch Frage für Frage ab. Am Ende gewinnt, wer mehr richtig hat.'],
k:'Antippen der Antworten.',
p:['Allein wird dein bestes Ergebnis pro Einstellung gespeichert.','In den Stufen Schwer und Experte läuft ein Zeitbalken. Ist er leer, zählt die Frage als falsch.'],
o:['Leicht: nur bekannte Länder, 3 Antworten.','Mittel: bekannte und mittelbekannte Länder, 4 Antworten.','Schwer: alle Länder, 6 Antworten, 12 Sekunden.','Experte: nur mittelbekannte und seltene Länder, 6 Antworten, 7 Sekunden.','Frageart: Flagge → Land oder Land → Flagge. Fragen: 10, 20 oder 30.'],
t:['Achte auf Farbfolge und Symbole: nordische Länder haben ein Kreuz, viele Länder in Afrika und Südosteuropa haben Streifen.']},
'Wörtle':{z:'Errate das gesuchte Wort mit möglichst wenigen Versuchen.',
s:['Tippe ein Wort mit der passenden Buchstabenzahl und bestätige mit ⏎. Mit ⌫ löschst du einen Buchstaben.','Jeder Buchstabe wird eingefärbt: Grün = richtiger Buchstabe an der richtigen Stelle. Gelb = kommt im Wort vor, aber an anderer Stelle. Grau = kommt nicht vor.','Nutze die Farben für den nächsten Versuch. Die Bildschirm-Tastatur färbt sich mit.','Hast du das Wort nicht rechtzeitig, wird es verraten.'],
k:'Bildschirm-Tastatur oder die Tastatur des Geräts (Enter, Rücktaste).',
p:['Es wird nicht geprüft, ob dein Wort im Wörterbuch steht, auch Fantasiewörter sind erlaubt, um Buchstaben auszuprobieren.','Umlaute wie Ä, Ö, Ü sind eigene Buchstaben.','Doppelte Buchstaben werden richtig gezählt: Ein E im Versuch wird nur gelb, wenn das Wort noch ein E übrig hat.'],
o:['Wortlänge: 4, 5 oder 6 Buchstaben.','Versuche: 8 (leicht), 6 oder 4 (Experte).'],
t:['Beginne mit einem Wort mit vielen häufigen Buchstaben (E, N, R, S, T, A).','Probiere im zweiten Versuch ein ganz anderes Wort, um mehr Buchstaben zu testen.']},
'Galgenmännchen':{z:'Errate das Wort, bevor das Männchen fertig gezeichnet ist.',
s:['Oben siehst du Striche für jeden Buchstaben. Tippe Buchstaben an, die im Wort vorkommen könnten.','Richtige Buchstaben erscheinen an allen passenden Stellen. Ein falscher Buchstabe zeichnet ein weiteres Stück des Männchens.','Zu zweit gibt Spieler 1 ein geheimes Wort ein (die Eingabe ist verdeckt) und gibt das Gerät weiter, Spieler 2 rät.','Wenn das Wort komplett ist, hast du gewonnen. Ist das Männchen fertig, wird das Wort verraten.'],
k:'Antippen der Buchstaben oder Tippen auf der Tastatur des Geräts. Bereits benutzte Buchstaben sind ausgegraut.',
p:['Anzahl der erlaubten Fehler: 8 bei Leicht und Mittel, 6 bei Schwer. Bei 6 Fehlern wird das Männchen entsprechend schneller gezeichnet.'],
o:['Leicht: kurze Wörter bis 7 Buchstaben und der erste Buchstabe ist geschenkt.','Mittel: Wörter mit 5 bis 10 Buchstaben.','Schwer: lange Wörter ab 9 Buchstaben und nur 6 Fehler.','Zu zweit gilt die Fehlerzahl der gewählten Stufe, das Wort darfst du selbst bestimmen.'],
t:['Starte mit den Vokalen E, A, I, dann mit häufigen Konsonanten wie N, R, S, T.','Achte auf die Wortlänge: Die Zahl der Striche verrät viel.']},
'Air Hockey':{z:'Schieße den Puck ins gegnerische Tor. Wer zuerst die eingestellte Torzahl erreicht, gewinnt.',
s:['Spieler 1 sitzt links, Spieler 2 oder der Computer rechts. Jeder spielt nur auf seiner Hälfte.','Der Puck startet nach einer kurzen Pause in der Mitte. Bewege deinen Schläger und schlage ihn.','Prallt der Puck an Wände, wird er zurückgeworfen. Nur die Öffnungen in der Mitte der kurzen Seiten sind Tore.','Nach jedem Tor wird der Puck in die Mitte gelegt.'],
k:'Zu zweit hat jeder seine Bildschirmhälfte: Ihr könnt beide gleichzeitig mit einem Finger spielen. Allein: Finger oder Maus bewegt den linken Schläger.',
p:['Der Puck übernimmt die Geschwindigkeit deines Schlägers: Schnelle Bewegung heißt schneller Puck.'],
o:['Gegner: Computer oder zu zweit.','Computer-Stärke: Leicht, Mittel oder Schwer. Je stärker, desto schneller und genauer der Computer.','Tore bis zum Sieg: 3, 5 oder 7.'],
t:['Verteidige zuerst: Bleibe mit dem Schläger zwischen Puck und Tor.','Schlage schräg über die Bande, das ist schwerer zu halten.']},
'Flatterflug':{z:'Fliege durch die Lücken und sammle Punkte, ohne anzustoßen.',
s:['Tippe zum Starten. Du fällst langsam.','Jeder Tipp lässt dich ein Stück steigen. Zwischen den Tipps sinkst du.','Jede passierte Lücke gibt einen Punkt. Nach und nach wird es schneller.','Zu zweit spielt ihr nacheinander. Wer die höhere Punktzahl hat, gewinnt.'],
k:'Tippen auf den Bildschirm oder Leertaste/Pfeil hoch.',
p:['Dein Bestwert wird je Thema und Schwierigkeit gespeichert.'],
o:['Thema: Vogel und Rohre oder Flugzeug und Hochhäuser. Nur das Aussehen ändert sich.','Schwierigkeit: die Lücken sind bei Leicht groß, bei Schwer klein.','Spieler: Allein oder zu zweit nacheinander.'],
t:['Kleine, gleichmäßige Tipps sind besser als wildes Hämmern.','Schau auf die nächste Lücke, nicht auf deine Figur.']},
'Neon-Dash':{z:'Laufe durch immer schwerere Level und komme so weit wie möglich. Beim Crash beginnst du den Versuch von vorn.',
s:['Tippe zum Starten. Dein Würfel läuft von allein nach rechts.','Tippe oder halte den Bildschirm, um zu springen. Wenn du hältst, springst du direkt nach jeder Landung wieder.','Am Ende jedes Levels kommt ein Zielstreifen. Danach beginnt das nächste Level, schneller und mit neuen Hindernissen.','Oben siehst du den Fortschritt im Level in Prozent.'],
k:'Tippen oder Halten auf dem Bildschirm, Leertaste oder Pfeil hoch. Im Flug-Abschnitt: Halten = steigen, Loslassen = sinken.',
p:['Spitzen und Sägeblätter (rote Zacken): Berührung ist tödlich. Springe darüber.','Blöcke: Du kannst auf ihnen landen und laufen. Die Seite eines Blocks zu berühren, ist tödlich.','Gruben (rot leuchtende Lücken im Boden): Springe darüber, sonst fällst du hinein.','Gelbe Sprungfelder: Du wirst automatisch hoch geschleudert, z. B. auf hohe Türme oder über lange Spitzenreihen.','Pinkes Portal: Du wirst zum Raumschiff und fliegst durch Röhren (Säulen von oben und unten). Berührst du eine Säule, ist es vorbei. Decke und Boden sind sicher. Das grüne Portal verwandelt dich zurück.','Level 1: Spitzen und Blöcke. Level 2: Gruben und der erste Flug-Abschnitt. Level 3: Sprungfelder und Türme. Level 4: Sägeblätter und Kombinationen. Level 5: Flug-Wellen. Ab Level 6: Volles Tempo mit allem zusammen.','Dein Bestwert in Metern wird pro Schwierigkeit und Startlevel gespeichert.'],
o:['Schwierigkeit: Leicht ist langsamer und hat mehr Platz zwischen den Hindernissen, Schwer ist schneller und enger.','Starten bei: Mit einem höheren Startlevel kannst du direkt neue Hindernisse üben, z. B. „Level 2“ für den Flug-Abschnitt.'],
t:['Spring möglichst spät vor Hindernissen, so landest du sicherer dahinter.','Beim Fliegen kleine, kurze Berührungen: Halten und Loslassen im Wechsel statt dauerhaft zu halten.','Auf einem Turm nach einem Sprungfeld brauchst du nicht zu springen, du landest von allein.']},
'Spiral-Sprung':{z:'Lass den Ball möglichst viele Ebenen nach unten fallen.',
s:['Tippe zum Starten, der Ball hüpft von allein.','Ziehe den Finger nach links oder rechts, um den Turm zu drehen.','Drehe die Lücke unter den Ball: Er fällt durch zur nächsten Ebene und du bekommst einen Punkt.','Rote Teile sind tödlich, der Ball prallt an ihnen nicht ab.'],
k:'Ziehen nach links/rechts oder Pfeiltasten.',
p:['Dein Ergebnis ist die Zahl der durchfallenen Ebenen.'],
t:['Drehe früh, nicht erst im letzten Moment.','Behalte immer die nächste Lücke im Blick, nicht nur die aktuelle.']},
'Straßenhüpfer':{z:'Überquere Straßen und Flüsse und komme so viele Reihen wie möglich weit.',
s:['Tippe zum Hüpfen nach vorn. Wische nach links, rechts oder zurück, um dich seitlich oder zurück zu bewegen.','Auf Straßen fahren Autos. Hüpfe in eine Lücke, nicht davor.','Im Wasser musst du auf Baumstämme hüpfen. Sie tragen dich mit, bis du abspringst. Fällst du ins Wasser oder wirst bis zum Bildrand getragen, ist es vorbei.','Bleibe nicht stehen: Der Bildschirm rückt langsam nach, wer hinten zurückbleibt, wird eingeholt.'],
k:'Tippen = vorwärts. Wischen = Seite oder zurück. Tastatur: Pfeile oder W/A/S/D.',
p:['Grasstreifen mit Bäumen sind sicher, Bäume versperren aber den Weg.','Dein Ergebnis ist die Zahl der erreichten Reihen.'],
o:['Schwierigkeit: Leicht hat langsamere Autos, Schwer deutlich schnellere Autos und schnellere Baumstämme.'],
t:['Beobachte erst einen Moment den Verkehr und hüpfe dann in einem Rutsch.','Auf Baumstämmen genau auf die Mitte springen, nicht auf den Rand.']},
'Farbland':{z:'Erobere möglichst viel Land, indem du Flächen einkreist, und überlebe die Gegner.',
s:['Wische oder nutze die Pfeiltasten, um dich zu bewegen. Du startest auf einem kleinen eigenen Stück Land.','Verlässt du dein Land, ziehst du eine Spur hinter dir her.','Kehrst du zu deinem Land zurück, wird die eingeschlossene Fläche ebenfalls deine.','Berührt jemand deine Spur, bist du raus. Berührst du die Spur eines Gegners, scheidet dieser aus und verliert sein Land. Gegner starten nach kurzer Zeit neu.'],
k:'Wischen in die gewünschte Richtung oder Pfeiltasten/W/A/S/D. Du musst nicht anhalten, du läufst immer weiter.',
p:['Dein Ergebnis ist der höchste Anteil am Spielfeld, den du erreicht hast (in Prozent).','Auch deine eigene Spur ist gefährlich: Wer in seine eigene Spur läuft, scheidet aus.'],
o:['Gegner: 2, 3 oder 4 Computer-Gegner.','Tempo: Gemütlich, Normal oder Schnell.'],
t:['Mache viele kleine Ausflüge statt eines großen, das ist sicherer.','Gegner sind gefährlich, wenn du lange draußen bist. Kreuze ihre Spuren, wenn sie weit von ihrem Land entfernt sind.']},
'Schlangenjagd':{z:'Friss Äpfel, werde so lang wie möglich und stoße nirgends an.',
s:['Wische oder drücke eine Pfeiltaste zum Starten und Lenken. Die Schlange kriecht von allein weiter.','Jeder Apfel macht sie länger und gibt einen Punkt.','Stößt du an eine Wand, einen Felsen oder deinen eigenen Körper, ist das Spiel vorbei.'],
k:'Wischen oder Pfeiltasten/W/A/S/D. Du kannst nicht direkt umdrehen.',
p:['Dein Bestwert wird für jede Kombination aus Tempo, Wänden und Hindernissen gespeichert.'],
o:['Tempo: Gemütlich, Normal oder Schnell.','Wände: tödlich, oder durchlässig (du kommst auf der anderen Seite wieder heraus).','Hindernisse: keine oder Felsen im Spielfeld.'],
t:['Lenke in großen Schleifen, damit du dich nicht einsperrst.','Bleibe möglichst nicht am Rand, sonst hast du weniger Platz zum Ausweichen.']},
'Steinbrecher':{z:'Zerstöre alle Steine mit dem Ball und fange Power-ups auf. Wenn der Ball unten herausfällt, verlierst du ein Leben.',
s:['Bewege den Schläger mit dem Finger. Tippe, um den Ball abzuschießen.','Lenke den Ball mit dem Schläger zurück. Trifft er den Rand des Schlägers, fliegt er flacher.','Zerstörte Steine lassen manchmal ein Power-up fallen. Fange es mit dem Schläger.','Sind alle Steine weg, beginnt das nächste Level mit einem neuen Muster und etwas schnellerem Ball.'],
k:'Finger oder Maus bewegt den Schläger, Tippen schießt (oder löst klebrige Bälle). Tastatur: Pfeile links/rechts, Leertaste.',
p:['Graue Steine brauchen 2 Treffer, goldene 3.','Gute Power-ups: W = breiter Schläger. M = Multiball (drei Bälle). F = Feuerball, fliegt durch Steine hindurch. L = Laser, der Schläger schießt von allein. S = langsamer Ball. K = klebriger Schläger, der Ball bleibt kleben und du schießt per Tippen. ♥ = ein Leben mehr (höchstens 6). B = Schutzschild, fängt einen fallenden Ball einmal auf.','Schlechte Power-ups (rot): N = schmaler Schläger. Z = schneller Ball. Weiche ihnen aus.','Aktive Effekte mit Restzeit stehen unten links.','Punkte: 10 bis 20 pro Stein, 25 pro Power-up, 100 pro geschafftem Level.'],
o:['Schwierigkeit: Leicht 5 Leben, langsamer Ball, mehr Power-ups. Mittel 3 Leben. Schwer 2 Leben, schnellerer Ball, weniger Power-ups.'],
t:['Fange gute Power-ups, auch wenn du dafür kurz den Ball vernachlässigst.','Mit dem Feuerball räumst du ganze Reihen in einem Rutsch ab.','Bei Multiball lieber den Schläger in der Mitte halten.']},
'Turmbau':{z:'Staple Blöcke zu einem möglichst hohen Turm.',
